name: Monitoreo diario de la fuente

on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. hora de Colombia (UTC-5)
  workflow_dispatch:        # permite ejecutarlo a mano para la captura de evidencia

permissions:
  contents: write           # para versionar el registro de ejecuciones

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Consultar la fuente y mostrar el resumen
        run: python notebooks/monitoreo_fuente.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Guardar el registro de la ejecución como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: registro-ejecuciones
          path: automatizacion/registro_ejecuciones.csv
      - name: Versionar el registro (evidencia acumulada en el repositorio)
        run: |
          git config user.name "orca-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add automatizacion/registro_ejecuciones.csv
          git diff --cached --quiet || git commit -m "Monitoreo diario de DS-01 [automático]"
          git push
